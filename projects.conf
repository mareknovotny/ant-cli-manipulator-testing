# Projects available to run-tests.sh.
#
# Format: name|relative-dir-under-antprojects|git-ref|deploy-version
#   name              - identifier passed as the first arg to run-tests.sh
#   relative-dir      - directory under $ANTPROJECTS containing the checkout
#   git-ref           - tag/branch to check out (in a disposable worktree)
#                        to get that version's build.xml; checkouts under
#                        antprojects/ always sit on main/master, and some of
#                        those have migrated off ant, so the ref needed to
#                        find a usable build.xml does not always match
#                        deploy-version and tag-naming differs per project
#   deploy-version    - value for -Dmaven.asf.release.deploy.version
#
# Lines starting with # and blank lines are ignored.

tomcat|tomcat|7.0.33|7.0.33
